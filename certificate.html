<style>
:root{ --bg:#F0F2F8; --surface:#fff; --surface2:#F4F6FB; --border:#E2E8F2; --text:#0F172A; --text2:#5A6785; --text3:#94A3B8;

<script type="module">
async function loadMod(list){ for (const s of list) { try { return await import(s); } catch(e){} } throw new Error('module not found: ' + list[0]); }
const fb = await loadMod(['./firebase.js','/firebase.js','../firebase.js'].map(p => p + '?cb=' + Date.now()));
const core = await loadMod(['./cert-core.js','/cert-core.js','../cert-core.js']);
const { db, auth, provider, doc, getDoc, getDocs, setDoc, updateDoc, collection, query, where, serverTimestamp, signInWithPopup, onAuthStateChanged } = fb;
const { SGP, EMP_LABELS, buildCert, publicDoc, certDuration, certCode, verifyUrl, certTitle, toMs } = core;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fD = ms => ms ? new Date(ms).toLocaleDateString('en-IN', { day:'2-digit', month:'long', year:'numeric' }) : '—';
const fDT = ms => ms ? new Date(ms).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const P = new URLSearchParams(location.search);
const S = { user:null, apps:[], roles:[], cur:null, c:null, tm:null };

function toast(m, type = 'info'){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
window.toggleTheme = function(){
  const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n); localStorage.setItem('theme', n);
  $('metaThemeColor').setAttribute('content', n === 'dark' ? '#0D1120' : '#F0F2F8');
};
const topbar = (title, back) => `<div class="top"><a class="ib" href="${back || 'hiring-portal.html'}" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><div class="ttl">${title}</div><div class="ib" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></div></div>`;

/* ---------- certificate renderer ---------- */
const qrCache = {};
function makeQR(text){
  if (qrCache[text]) return Promise.resolve(qrCache[text]);
  return new Promise(res => {
    const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:-999px;top:0'; document.body.appendChild(d);
    new QRCode(d, { text, width:240, height:240, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => { const cv = d.querySelector('canvas'); const u = cv ? cv.toDataURL('image/png') : ((d.querySelector('img') || {}).src || ''); d.remove(); qrCache[text] = u; res(u); }, 60);
  });
}
async function fingerprint(c){
  const s = [c.id, c.name, c.roleTitle, c.startMs, c.endMs, c.durationLabel].join('|');
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase().slice(0, 20).match(/.{4}/g).join('-');
  } catch(e) { let x = 0; for (const ch of s) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return x.toString(16).toUpperCase().padStart(8, '0'); }
}

function certHtml(c, qr, fp){
  const intern = c.kind === 'INTERN';
  const achievement = c.kind === 'ACHIEVEMENT';
  const role = esc(c.roleTitle), dur = esc(c.durationLabel || '1 Month');
  const sg = SGP.signatory;

  let titleTop = 'EXPERIENCE';
  let kindSub = 'CERTIFICATE';
  let bodyText = '';
  let chips = [];
  let themeClass = 'job';

  if (intern) {
    themeClass = 'intern';
    titleTop = 'CERTIFICATE';
    kindSub = 'OF INTERNSHIP';
    bodyText = `has successfully completed an <b>Internship</b> as <b>${role}</b> at <b>Study Grid Prep</b> from <b>${fD(c.startMs)}</b> to <b>${fD(c.endMs)}</b>, with a total duration of <b>${dur}</b>.${c.note ? ' ' + esc(c.note) : ' During this period, they showed dedication, ownership and a strong willingness to learn.'}`;
    chips = [
      ['INTERNSHIP ROLE', role],
      ['TOTAL DURATION', dur],
      ['COMPLETED ON', fD(c.endMs)]
    ];
  } else if (achievement) {
    themeClass = 'achievement';
    titleTop = 'CERTIFICATE';
    kindSub = 'OF ACHIEVEMENT';
    bodyText = `has been awarded this <b>Certificate of Achievement</b> at <b>Study Grid Prep</b> as <b>${role}</b> in recognition of outstanding performance and valuable contributions from <b>${fD(c.startMs)}</b> to <b>${fD(c.endMs)}</b>.${c.note ? ' ' + esc(c.note) : ' We commend their excellence and wish them continued success in all future endeavors.'}`;
    chips = [
      ['DESIGNATION', role],
      ['RECOGNITION', 'Outstanding Contributor'],
      ['ISSUED ON', fD(c.issuedMs || c.endMs)]
    ];
  } else {
    themeClass = 'job';
    titleTop = 'EXPERIENCE';
    kindSub = 'CERTIFICATE';
    bodyText = `has worked with <b>Study Grid Prep</b> as <b>${role}</b> from <b>${fD(c.startMs)}</b> to <b>${fD(c.endMs)}</b>, with a total experience of <b>${dur}</b>.${c.note ? ' ' + esc(c.note) : ' During this tenure, they contributed professionally and reliably to the team. We wish them every success ahead.'}`;
    chips = [
      ['DESIGNATION', role],
      ['TOTAL EXPERIENCE', dur],
      ['LAST WORKING DAY', fD(c.endMs)]
    ];
  }

  return `<div class="sgc ${themeClass}">
    ${intern ? '<div class="band"></div>' : ''}<div class="frame"></div><div class="frame2"></div>
    <div class="in">
      <div class="head">
        <img src="/icon-192.png" alt="Study Grid Prep">
        <div>
          <div class="org">STUDY GRID PREP</div>
          <div class="tag">Smart Study Platform</div>
        </div>
      </div>
      <div class="title">${titleTop}</div>
      <div class="kind">${kindSub}</div>
      <div class="cert-l">This is to certify that</div>
      <div class="name">${esc(c.name)}</div>
      <div class="body">${bodyText}</div>
      <div class="chips2">${chips.map(x => `<div class="c2"><div class="a">${x[0]}</div><div class="b">${x[1]}</div></div>`).join('')}</div>
      <div class="foot">
        <div class="qr">
          <img src="${qr}" alt="QR Code">
          <div class="t"><b>SCAN TO VERIFY</b>Certificate ID: ${certCode(c.id)}<br>Issued: ${fD(c.issuedMs || c.endMs)}</div>
        </div>
        <div class="sig">
          <div class="s">${esc(sg.name)}</div>
          <div class="ln"></div>
          <div class="n">${esc(sg.name)}</div>
          <div class="r">${esc(sg.title)}</div>
          <div class="ds">
            <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="#16a34a"/><path d="m8.5 12 2.6 2.6L16 9.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div><b>Digitally signed</b> by Study Grid Prep<br>${fDT(c.issuedMs || c.endMs)} · ${fp}</div>
          </div>
        </div>
      </div>
    </div>
    <svg class="seal" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="g${intern ? 1 : (achievement ? 3 : 2)}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${intern ? '#6366f1' : (achievement ? '#fbbf24' : '#f1d775')}"/>
          <stop offset="1" stop-color="${intern ? '#7c3aed' : (achievement ? '#d97706' : '#b8902a')}"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="47" fill="url(#g${intern ? 1 : (achievement ? 3 : 2)})"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-opacity=".7" stroke-dasharray="2 3"/>
      <path d="m50 24 6.5 13.2 14.5 2.1-10.5 10.2 2.5 14.4L50 56.9l-13 6.9 2.5-14.4L29 39.3l14.5-2.1z" fill="#fff"/>
      <text x="50" y="80" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff" letter-spacing="1.2">VERIFIED</text>
    </svg>
  </div>`;
}

function fit(host){
  const st = host.querySelector('.stage'); if (!st) return;
  const sc = Math.min(1, st.clientWidth / 1123);
  st.querySelector('.scaler').style.transform = `scale(${sc})`; st.style.height = (794 * sc) + 'px';
}
async function paint(host, c, locked){
  const [qr, fp] = await Promise.all([makeQR(verifyUrl(c.id)), fingerprint(c)]);
  host.classList.add('certhost');
  host.innerHTML = `<div class="stage ${locked ? 'lockd' : ''}"><div class="scaler">${certHtml(c, qr, fp)}</div>${locked ? '<div class="lock"><i class="fa-solid fa-lock"></i>Preview — unlocks on download</div>' : ''}</div>`;
  fit(host);
}
addEventListener('resize', () => document.querySelectorAll('.certhost').forEach(fit));

async function exportCanvas(c){
  const [qr, fp] = await Promise.all([makeQR(verifyUrl(c.id)), fingerprint(c)]);
  const h = document.createElement('div'); h.style.cssText = 'position:fixed;left:-12000px;top:0;width:1123px;height:794px';
  h.innerHTML = certHtml(c, qr, fp); document.body.appendChild(h);
  try { await document.fonts.ready; await new Promise(r => setTimeout(r, 250));
    return await html2canvas(h.firstElementChild, { scale:2, useCORS:true, backgroundColor:null, logging:false });
  } finally { h.remove(); }
}
const fname = c => `${certTitle(c.kind).replace(/\s+/g, '-')}_${(c.name || 'Study-Grid-Prep').replace(/\s+/g, '-')}`;
async function mark(field){
  if (!S.cur || S.cur[field]) return;
  try { await updateDoc(doc(db, 'hiringApplications', S.cur.id), { [field]: serverTimestamp() }); S.cur[field] = new Date(); } catch(e) { console.warn('mark', e); }
}
let busy = false;
async function withBusy(btn, fn){
  if (busy) return; busy = true; const old = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Preparing…'; }
  try { await fn(); } catch(e) { console.error(e); toast('Something went wrong — try again'); }
  finally { busy = false; if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
window.dlPdf = b => withBusy(b, async () => {
  const cv = await exportCanvas(S.c); const pdf = new jspdf.jsPDF({ orientation:'landscape', unit:'px', format:[1123, 794] });
  pdf.addImage(cv.toDataURL('image/jpeg', .95), 'JPEG', 0, 0, 1123, 794); pdf.save(fname(S.c) + '.pdf'); mark('certDownloadAt'); toast('PDF downloaded');
});
window.dlPng = b => withBusy(b, async () => {
  const cv = await exportCanvas(S.c); const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = fname(S.c) + '.png'; a.click(); mark('certDownloadAt'); toast('Image downloaded');
});
window.printCert = b => withBusy(b, async () => {
  const cv = await exportCanvas(S.c); $('printArea').innerHTML = `<img src="${cv.toDataURL('image/png')}">`;
  mark('certPrintAt'); await new Promise(r => setTimeout(r, 200)); print();
});
window.shareCert = b => withBusy(b, async () => {
  const c = S.c, url = verifyUrl(c.id);
  const text = `🎓 I received my ${certTitle(c.kind)} from Study Grid Prep as ${c.roleTitle} (${c.durationLabel}). Verify it here: ${url}`;
  try {
    if (navigator.share) {
      const cv = await exportCanvas(c); const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const file = new File([blob], fname(c) + '.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file], title: certTitle(c.kind), text });
      else await navigator.share({ title: certTitle(c.kind), text, url });
    } else { await navigator.clipboard.writeText(text); toast('Link copied'); }
    mark('certShareAt');
  } catch(e) { if (e && e.name !== 'AbortError') toast('Share cancelled'); }
});
window.linkedIn = function(){
  const c = S.c, d = new Date(c.endMs || Date.now());
  const u = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME' + `&name=${encodeURIComponent(certTitle(c.kind) + ' – ' + c.roleTitle)}&organizationName=${encodeURIComponent('Study Grid Prep')}&issueYear=${d.getFullYear()}&issueMonth=${d.getMonth() + 1}&certUrl=${encodeURIComponent(verifyUrl(c.id))}&certId=${encodeURIComponent(certCode(c.id))}`;
  window.open(u, '_blank', 'noopener'); mark('certShareAt');
};
window.copyLink = async function(){ try { await navigator.clipboard.writeText(verifyUrl(S.c.id)); toast('Verification link copied'); } catch(e) { toast(verifyUrl(S.c.id)); } };

/* ================= PUBLIC VERIFY (QR) ================= */
async function verifyMode(id){
  document.title = 'Verify Certificate – Study Grid Prep';
  $('app').innerHTML = `<div class="brand"><img src="/icon-192.png" alt="Study Grid Prep">Study Grid Prep · Certificate Verification</div>
    <div class="card vcard" id="vc"><div class="vseal"><div class="scan"></div></div><div class="vt">Verifying…</div><div class="vs">Checking this certificate against Study Grid Prep records</div></div><div id="vprev"></div>`;
  const t0 = Date.now(); let d = null;
  try { const s = await getDoc(doc(db, 'certificates', id)); if (s.exists()) d = s.data(); } catch(e) { console.warn(e); }
  await new Promise(r => setTimeout(r, Math.max(0, 1300 - (Date.now() - t0))));
  const vc = $('vc');
  if (!d || d.status === 'revoked') {
    vc.innerHTML = `<div class="vseal"><svg class="shield bad" viewBox="0 0 100 100"><path class="sh" d="M50 6 14 20v28c0 22 15 38 36 46 21-8 36-24 36-46V20z"/><path class="ck" d="M36 36l28 28M64 36 36 64"/></svg></div>
      <div class="vt" style="color:var(--red)">${d ? 'Certificate revoked' : 'Could not verify'}</div><div class="vs">${d ? 'This certificate is no longer valid.' : 'No certificate with this ID exists in Study Grid Prep records.'}</div>`;
    return;
  }
  const c = { ...d, id };
  vc.innerHTML = `<div class="vseal"><div class="pulse"></div><svg class="shield" viewBox="0 0 100 100"><path class="sh" d="M50 6 14 20v28c0 22 15 38 36 46 21-8 36-24 36-46V20z"/><path class="ck" d="m33 50 12 12 23-26"/></svg></div>
    <div class="vt" style="color:var(--green)">Verified ✓</div><div class="vs">Official ${c.kind === 'INTERN' ? 'internship' : (c.kind === 'ACHIEVEMENT' ? 'achievement' : 'experience')} certificate from <b>Study Grid Prep</b></div>
    <div class="vtable"><div><b>Recipient Name</b><span>${esc(c.name)}</span></div><div><b>${c.kind === 'INTERN' ? 'Internship Role' : 'Designation'}</b><span>${esc(c.roleTitle)}</span></div>
    <div><b>Total Duration / Experience</b><span>${esc(c.durationLabel)}</span></div><div><b>Period</b><span>${fD(c.startMs)} – ${fD(c.endMs)}</span></div>
    <div><b>Certificate ID</b><span>${certCode(id)}</span></div><div><b>Issued Date</b><span>${fD(c.issuedMs || c.endMs)}</span></div></div>`;
  paint($('vprev'), c);
}

/* ================= OWNER VIEW ================= */
function authView(){
  $('app').innerHTML = topbar('Certificate') + `<div class="card center"><i class="fa-solid fa-award big"></i><div class="h3">Sign in to get your certificate</div><div class="p2" style="margin-bottom:16px">Use the same Google account you applied with.</div><button class="btn p" onclick="signIn()"><i class="fa-brands fa-google"></i> Continue with Google</button></div>`;
}
window.signIn = async () => { try { await signInWithPopup(auth, provider); } catch(e) { toast('Sign-in failed'); } };

async function loadOwner(user){
  S.user = user;
  const [as, rs] = await Promise.all([getDocs(query(collection(db, 'hiringApplications'), where('uid', '==', user.uid))), getDocs(collection(db, 'hiringRoles'))]);
  S.roles = rs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.apps = as.docs.map(d => ({ id: d.id, ...d.data() })).filter(a => a.finalStatus === 'selected' && toMs(a.offerAcceptedAt)).sort((a, b) => toMs(b.offerAcceptedAt) - toMs(a.offerAcceptedAt));
  const want = P.get('app');
  S.cur = S.apps.find(a => a.id === want) || S.apps[0] || null;
  renderOwner();
}
window.pick = id => { S.cur = S.apps.find(a => a.id === id); renderOwner(); };

/* ---- Edit Name Modal (Confirm once & permanently update) ---- */

  if (!S.c || !S.cur) return;
  const curName = S.c.name || S.user.displayName || '';
  $('lvOv').innerHTML = `<div class="sheet" style="max-width:440px;text-align:left;">
    <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;"><i class="fa-solid fa-user-pen" style="color:var(--accent);margin-right:8px;"></i>Confirm / Edit Name</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:14px;">Enter your full legal name as it should appear on your verified certificate. Once saved, it will be permanently stored on this certificate.</div>
    <div style="margin-bottom:16px;">
      <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:block;">Full Name</label>
      <input type="text" id="certNameInput" value="${esc(curName)}" style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);font-size:14px;font-weight:700;outline:none;" placeholder="e.g. Ayush Kumar Gupta">
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn" style="flex:1;" onclick="closeLv()">Cancel</button>
      <button class="btn p" id="saveNameBtn" style="flex:1;" onclick="saveCertName()"><i class="fa-solid fa-floppy-disk"></i> Save &amp; Update</button>
    </div>
  </div>`;
  $('lvOv').classList.add('open');
};

window.saveCertName = async function(){
  const inp = $('certNameInput');
  const val = inp ? inp.value.trim() : '';
  if (!val) { toast('Please enter a valid name', 'warning'); return; }
  const btn = $('saveNameBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…'; }
  try {
    const ref = doc(db, 'hiringApplications', S.cur.id);
    await updateDoc(ref, { certName: val, name: val, 'certOverride.name': val });
    S.cur.certName = val;
    S.cur.name = val;
    if (S.c) S.c.name = val;
    await publish(S.c);
    closeLv();
    toast('Name saved on certificate', 'success');
    renderOwner();
  } catch(e) {
    console.error(e);
    toast('Could not save name — please try again', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save &amp; Update'; }
  }
};

async function renderOwner(){
  clearInterval(S.tm);
  const head = topbar('Certificate');
  if (!S.cur) { $('app').innerHTML = head + `<div class="card center"><i class="fa-solid fa-award big"></i><div class="h3">No certificate yet</div><div class="p2">Your certificate appears here once you accept an offer and start working.</div></div>`; return; }
  const role = S.roles.find(r => r.id === S.cur.roleId);
  const c = S.c = buildCert(S.cur, role);
  const chips = S.apps.length > 1 ? `<div class="chips">${S.apps.map(a => `<div class="chip ${a.id === S.cur.id ? 'on' : ''}" onclick="pick('${a.id}')">${esc((S.roles.find(r => r.id === a.roleId) || {}).title || 'Role')}</div>`).join('')}</div>` : '';
  const kindName = certTitle(c.kind);
  let html = head + `<div class="sub">${kindName} — auto-generated, digitally signed and verifiable with a QR code.</div>` + chips;

  if (c.state === 'revoked') {
    html += `<div class="card"><div class="ok-head"><div class="ok-ico red"><i class="fa-solid fa-ban"></i></div><div><div class="h3">Certificate not available</div><div class="p2">Your engagement with this role was ended by the team.</div></div></div></div>`;
  } else if (c.state === 'active') {
    const proj = certDuration(c.startMs, Date.now());
    const intern = c.kind === 'INTERN';
    html += `<div class="card"><div class="ok-head"><div class="ok-ico amber"><i class="fa-solid fa-hourglass-half"></i></div><div><div class="h3">${intern ? 'Internship in progress' : 'You are currently working'}</div><div class="p2">${esc(c.roleTitle)} · Started ${fD(c.startMs)}</div></div></div>
      <div class="k">${intern ? 'Certificate unlocks in' : 'Working since'}</div><div class="cd" id="cd">—</div>
      ${intern ? '<div class="bar"><span id="cdBar" style="width:0%"></span></div><div class="p2" style="margin-top:8px">Full certificate for ' + c.plannedMonths + ' months is released automatically on completion.</div>' : ''}
      <div class="acts"><button class="btn r" ${proj.eligible ? '' : 'disabled'} onclick="askLeave()"><i class="fa-solid fa-award"></i> ${proj.eligible ? 'Get certificate now' : 'Unlocks after 15 days'}</button></div>
      <div class="p2" style="margin-top:10px"><i class="fa-solid fa-circle-info"></i> Downloading before completion means leaving this role. You will be asked to confirm.</div></div><div id="pv"></div>`;
    $('app').innerHTML = html;
    const pv = { ...c, endMs: Date.now(), months: proj.months, durationLabel: core.fmtMonths(proj.months, proj.days), issuedMs: Date.now() };
    if (proj.eligible) paint($('pv'), pv, true);
    const tick = () => {
      const el = $('cd'); if (!el) return clearInterval(S.tm);
      if (intern) { const left = c.plannedEndMs - Date.now(); if (left <= 0) { clearInterval(S.tm); return renderOwner(); }
        el.textContent = fmtDur(left); $('cdBar').style.width = Math.min(100, (Date.now() - c.startMs) / (c.plannedEndMs - c.startMs) * 100) + '%'; }
      else el.textContent = fmtDur(Date.now() - c.startMs);
    }; tick(); S.tm = setInterval(tick, 1000);
    return;
  } else if (!c.eligible) {
    html += `<div class="card"><div class="ok-head"><div class="ok-ico amber"><i class="fa-solid fa-clock"></i></div><div><div class="h3">Certificate not issued</div><div class="p2">A minimum of ${SGP.minDays} days of work is required. You worked ${c.days} day${c.days === 1 ? '' : 's'}.</div></div></div></div>`;
  } else {
    html += `<div class="card"><div class="ok-head"><div class="ok-ico"><i class="fa-solid fa-circle-check"></i></div><div><div class="h3">Your certificate is ready 🎉</div><div class="p2">${esc(c.name)} · ${esc(c.durationLabel)} · ${fD(c.startMs)} – ${fD(c.endMs)}</div></div></div>
      <div id="pv"></div>
      <div class="acts">
        <button class="btn p" onclick="dlPdf(this)"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
        <button class="btn" onclick="dlPng(this)"><i class="fa-solid fa-image"></i> Image (PNG)</button>
        <button class="btn" onclick="openNameModal()"><i class="fa-solid fa-user-pen"></i> Edit / Confirm Name</button>
        <button class="btn" onclick="printCert(this)"><i class="fa-solid fa-print"></i> Print</button>
        <button class="btn g" onclick="shareCert(this)"><i class="fa-solid fa-share-nodes"></i> Share</button>
        <button class="btn li" onclick="linkedIn()"><i class="fa-brands fa-linkedin"></i> Add to LinkedIn</button>
      </div>
      <div class="linkbox"><i class="fa-solid fa-link"></i><span style="flex:1">${verifyUrl(c.id)}</span><button class="btn" style="padding:6px 10px" onclick="copyLink()"><i class="fa-regular fa-copy"></i></button></div></div>
      <div class="card"><div class="grid2"><div><div class="k">Certificate ID</div><div class="v">${certCode(c.id)}</div></div><div><div class="k">Type</div><div class="v">${c.kind === 'INTERN' ? 'Internship' : (c.kind === 'ACHIEVEMENT' ? 'Achievement' : 'Experience (' + esc(EMP_LABELS[c.empType] || 'Full-time') + ')')}</div></div>
      <div><div class="k">Designation</div><div class="v">${esc(c.roleTitle)}</div></div><div><div class="k">Duration</div><div class="v">${esc(c.durationLabel)}</div></div>
      <div><div class="k">Issued Date</div><div class="v">${fD(c.issuedMs || c.endMs)}</div></div><div><div class="k">Status</div><div class="v" style="color:var(--green)">Verified ✓</div></div></div></div>`;
    $('app').innerHTML = html; paint($('pv'), c); publish(c); return;
  }
  $('app').innerHTML = html;
}

function fmtDur(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0'); return d > 0 ? `${d}d ${p(h)}h ${p(m)}m` : `${p(h)}:${p(m)}:${p(x)}`; }
async function publish(c){
  try { await setDoc(doc(db, 'certificates', c.id), { ...publicDoc(c), uid: S.user.uid, updatedAt: serverTimestamp() }, { merge:true }); await mark('certIssuedAt'); }
  catch(e) { console.warn('publish cert', e); }
}

/* ---- leave & generate (caution flow) ---- */
window.askLeave = function(){
  const c = S.c, proj = certDuration(c.startMs, Date.now());
  $('lvOv').innerHTML = `<div class="sheet"><div class="warn"><i class="fa-solid fa-triangle-exclamation"></i></div><h3>This will end your role</h3>
    <div class="p2">To generate your certificate now, you must leave <b>${esc(c.roleTitle)}</b>.</div>
    <ul><li>Your access to this role at Study Grid Prep ends immediately.</li><li>Your leaving date &amp; time is recorded exactly and the admin is notified.</li><li>Your certificate will show <b>${esc(core.fmtMonths(proj.months, proj.days))}</b> of work.</li><li>This cannot be undone.</li></ul>
    <label class="chk"><input type="checkbox" id="lvChk" onchange="$('lvYes').disabled=!this.checked"><span class="box"><svg viewBox="0 0 20 20"><path d="m4 10 4 4 8-8"/></svg></span><span>I understand and I want to leave this role.</span></label>
    <div class="row"><button class="btn" onclick="closeLv()">Cancel</button><button class="btn r" id="lvYes" disabled onclick="confirmLeave()">Yes, leave &amp; generate</button></div></div>`;
  $('lvOv').classList.add('open');
};
window.$ = $;
window.closeLv = () => $('lvOv').classList.remove('open');
window.confirmLeave = async function(){
  if (!$('lvChk') || !$('lvChk').checked) return;
  const b = $('lvYes'); b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Leaving…';
  try {
    const ref = doc(db, 'hiringApplications', S.cur.id);
    await updateDoc(ref, { offerStatus:'left', offerLeftAt: serverTimestamp(), offerLeftBy:'candidate', offerLeftVia:'certificate', leaveAck:false });
    const snap = await getDoc(ref); const fresh = { ...S.cur, ...snap.data(), id: S.cur.id };
    S.apps = S.apps.map(a => a.id === fresh.id ? fresh : a); S.cur = fresh;
    $('lvOv').innerHTML = `<div class="sheet"><svg class="tick" viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/><path d="m27 46 12 12 25-27"/></svg><h3>Role left · certificate generated</h3><div class="p2">${fDT(toMs(fresh.offerLeftAt) || Date.now())}</div></div>`;
    setTimeout(() => { closeLv(); renderOwner(); }, 1500);
  } catch(e) { console.error(e); toast('Could not complete — please try again', 'error'); closeLv(); }
};

const vid = P.get('v');
if (vid) verifyMode(vid);
else onAuthStateChanged(auth, u => { if (u) loadOwner(u).catch(e => { console.error(e); $('app').innerHTML = topbar('Certificate') + '<div class="card center"><i class="fa-solid fa-triangle-exclamation big"></i>Could not load. Please refresh.</div>'; }); else authView(); });
</script>

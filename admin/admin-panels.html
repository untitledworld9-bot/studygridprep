<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Grid Prep - Admin Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
--bg:#07080d;--panel:#10131d;--card:#161b27;--accent:#7c5cfc;
--text:#eef0ff;--muted:#8b93b5;--border:rgba(255,255,255,.08)
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top right,#7c5cfc22,transparent 35%),
radial-gradient(circle at bottom left,#2f6bff11,transparent 40%),var(--bg);
color:var(--text);
display:flex;
}
.sidebar{
position:fixed;left:0;top:0;width:260px;height:100vh;
background:var(--panel);border-right:1px solid var(--border);
padding:22px;
}
.logo{font-size:22px;font-weight:700}
.role{font-size:12px;color:var(--muted);margin-top:6px}
.main{margin-left:260px;flex:1;height:100vh;overflow:auto;padding:24px 40px}
.header{
position:sticky;top:0;z-index:20;
background:rgba(7,8,13,.78);
backdrop-filter:blur(18px);
padding:18px 0 20px;
border-bottom:1px solid var(--border);
margin-bottom:28px;
animation:down .7s;
}
.header h1{font-size:34px}
.header p{color:var(--muted);margin-top:6px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:22px;
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:24px;
display:flex;
flex-direction:column;
gap:18px;
transition:.3s;
animation:up .6s both;
}
.card:hover{
transform:translateY(-6px);
border-color:#7c5cfc66;
}
.icon{
width:56px;height:56px;border-radius:14px;
display:flex;align-items:center;justify-content:center;
background:#7c5cfc22;color:#9b85ff;font-size:22px;
}
.title{font-size:22px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{
padding:6px 10px;border-radius:30px;
background:#ffffff10;font-size:12px
}
.btn{
margin-top:auto;
padding:13px;
border-radius:12px;
background:var(--accent);
text-align:center;
font-weight:700;
color:white;
}
.danger .btn{background:#e53935}
#intro{
position:fixed;inset:0;background:#07080d;
display:flex;align-items:center;justify-content:center;
flex-direction:column;z-index:999;
animation:hide 1.8s forwards 1.2s;
}
#intro h1{font-size:42px}
#intro p{margin-top:10px;color:#aaa}
@keyframes hide{to{opacity:0;visibility:hidden}}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="intro">
<h1>👋 Welcome Admin</h1>
<p>Initializing Secure Workspace...</p>
</div>

<aside class="sidebar">
<div class="logo">Study Grid Prep</div>
<div class="role">ADMIN HUB</div>
</aside>

<main class="main">
<div class="header">
<h1>Welcome Back</h1>
<p>Select a module</p>
</div>

<div class="grid">

<a class="card" href="/admin/sub-admin">
<div class="icon"><i class="fa-solid fa-users-gear"></i></div>
<div class="title">Sub Admin</div>
<div class="chips"><span>Users</span><span>Reports</span><span>Push</span></div>
<div class="btn">Open Panel</div>
</a>

<a class="card" href="/admin/admin-media">
<div class="icon"><i class="fa-solid fa-photo-film"></i></div>
<div class="title">Media Studio</div>
<div class="chips"><span>Assets</span><span>Upload</span><span>Library</span></div>
<div class="btn">Open Panel</div>
</a>

<a class="card" href="/admin/admin-mock">
<div class="icon"><i class="fa-solid fa-graduation-cap"></i></div>
<div class="title">Mock Admin</div>
<div class="chips"><span>Tests</span><span>Results</span><span>Exam</span></div>
<div class="btn">Open Panel</div>
</a>

<a class="card danger" href="/admin/SGPAdmin-main">
<div class="icon"><i class="fa-solid fa-crown"></i></div>
<div class="title">SGP Main</div>
<div class="chips"><span>Revenue</span><span>Control</span><span>Root</span></div>
<div class="btn">Authorize</div>
</a>

</div>
</main>
</body>
</html>

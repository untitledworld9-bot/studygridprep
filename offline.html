<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Offline – Study Grid Prep</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script>
(function(){
  var saved = localStorage.getItem("theme");
  var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = (!saved || saved === "system") ? (systemDark ? "dark" : "light") : saved;
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>html{ visibility:hidden; } html[data-theme]{ visibility:visible; }</style>

<style>
:root {
  --bg:      #F0F2F8;
  --surface: #FFFFFF;
  --border:  #E2E8F2;
  --text:    #0F172A;
  --text2:   #5A6785;
  --text3:   #94A3B8;
  --accent:  #5B5BF6;
  --red:     #EF4444;
  --green:   #10B981;
}
[data-theme="dark"] {
  --bg:      #0D1120;
  --surface: #151E32;
  --border:  rgba(255,255,255,0.08);
  --text:    #E8F0FE;
  --text2:   #8B9EC8;
  --text3:   #3D5080;
}

*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  font-family: 'Poppins', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background: var(--bg);
  min-height: 100dvh;
}
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px;
  color: var(--text);
}

.off-logo {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 28px;
}
.off-logo img { width: 32px; height: 32px; border-radius: 9px; }
.off-logo span { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }

.off-card {
  width: 100%; max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 28px 30px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  box-shadow: 0 8px 28px rgba(0,0,0,0.10);
}

.off-icon-circle {
  width: 68px; height: 68px; border-radius: 50%;
  background: rgba(239,68,68,0.10);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: var(--red);
  margin-bottom: 22px;
}

.off-title {
  font-size: 20px; font-weight: 800; line-height: 1.3;
  margin-bottom: 22px;
}

.off-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.off-btn:active { transform: scale(0.97); }
.off-btn:disabled { opacity: 0.7; }

.off-avail-label {
  width: 100%; max-width: 360px;
  font-size: 10.5px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin: 22px 0 8px 4px;
}

.off-avail-row {
  width: 100%; max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 11px;
  text-decoration: none; color: inherit;
  margin-bottom: 8px;
  transition: transform 0.12s ease;
}
.off-avail-row:active { transform: scale(0.98); }

.off-avail-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.off-avail-icon.focus { background: rgba(249,115,22,0.12); }
.off-avail-icon.todo  { background: rgba(91,91,246,0.12); }

.off-avail-name { flex: 1; font-size: 13px; font-weight: 700; }

.off-avail-badge {
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; color: var(--green, #10B981);
  flex-shrink: 0;
}
.off-avail-badge i { font-size: 11px; }

.off-footer {
  margin-top: 18px; font-size: 11.5px; color: var(--text3);
}
</style>
</head>
<body>

<div class="off-logo">
  <img src="/icon-192.png" alt="" onerror="this.style.display='none'">
  <span>Study Grid Prep</span>
</div>

<div class="off-card">
  <div class="off-icon-circle">
    <i class="fa-solid fa-wifi"></i>
  </div>
  <div class="off-title">No internet connection</div>
  <button class="off-btn" id="retryBtn" onclick="retryConnection()">
    <span id="retryText">Try Again</span>
  </button>
</div>

<div class="off-avail-label">Available Offline</div>

<a href="/focus.html" class="off-avail-row" id="row-focus">
  <div class="off-avail-icon focus">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="13" r="8" stroke="#F97316" stroke-width="2"/>
      <polyline points="12,9 12,13 14.5,13" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="14" y2="3" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="3" x2="12" y2="5" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="off-avail-name">Focus Timer</div>
  <div class="off-avail-badge" id="badge-focus">
    <i class="fa-solid fa-circle-notch fa-spin"></i> Checking...
  </div>
</a>

<a href="/todo.html" class="off-avail-row" id="row-todo">
  <div class="off-avail-icon todo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="rgba(91,91,246,0.1)" stroke="#5B5BF6" stroke-width="1.5"/>
      <polyline points="8,12 10.5,14.5 16,9" stroke="#5B5BF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="8" y1="8" x2="10" y2="8" stroke="#5B5BF6" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="16" x2="10" y2="16" stroke="#5B5BF6" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="off-avail-name">To-do List</div>
  <div class="off-avail-badge" id="badge-todo">
    <i class="fa-solid fa-circle-notch fa-spin"></i> Checking...
  </div>
</a>

<div class="off-footer">Your progress is saved on this device</div>

<script>
function _returnDestination() {
  try {
    return sessionStorage.getItem('sgp_offline_from') || '/dashboard-home.html';
  } catch (e) {
    return '/dashboard-home.html';
  }
}

function retryConnection() {
  var btn = document.getElementById('retryBtn');
  var text = document.getElementById('retryText');

  btn.disabled = true;
  text.textContent = 'Checking...';

  setTimeout(function() {
    if (navigator.onLine) {
      window.location.replace(_returnDestination());
    } else {
      btn.disabled = false;
      text.textContent = 'Try Again';
    }
  }, 1200);
}

window.addEventListener('online', function() {
  window.location.replace(_returnDestination());
});

var poll = setInterval(function() {
  if (navigator.onLine) {
    clearInterval(poll);
    window.location.replace(_returnDestination());
  }
}, 2000);

// ✅ Check REAL cache status — don't just claim "Downloaded" statically.
async function checkAvailability(path, badgeId, rowSelector) {
  var badge = document.getElementById(badgeId);
  var row = document.querySelector(rowSelector);
  try {
    var match = await caches.match(path, { ignoreSearch: true });
    if (match) {
      badge.innerHTML = '<i class="fa-solid fa-circle-check"></i> Downloaded';
      badge.style.color = 'var(--green)';
      // Cached — let the tap navigate normally; the Service Worker will
      // serve it straight from cache even with no connection.
    } else {
      badge.innerHTML = '<i class="fa-regular fa-circle"></i> Not saved yet';
      badge.style.color = 'var(--text3)';
      // Not actually cached — navigating now (while offline) would just
      // hit the browser's own raw error page. Block the tap here instead
      // and explain, rather than letting it fail silently.
      row.addEventListener('click', function(e) {
        if (!navigator.onLine) {
          e.preventDefault();
          alert('This page hasn\'t been saved for offline use yet. Open it once while connected to the internet to enable this.');
        }
      });
    }
  } catch (e) {
    badge.innerHTML = '<i class="fa-regular fa-circle"></i> Not saved yet';
    badge.style.color = 'var(--text3)';
  }
}

if ('caches' in window) {
  checkAvailability('/focus.html', 'badge-focus', '#row-focus');
  checkAvailability('/todo.html', 'badge-todo', '#row-todo');
} else {
  document.getElementById('badge-focus').innerHTML = '<i class="fa-regular fa-circle"></i> Unknown';
  document.getElementById('badge-todo').innerHTML = '<i class="fa-regular fa-circle"></i> Unknown';
}
</script>

</body>
</html>
